name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This doesn't require deleting anything before it's verified on the PC (see CONTRIBUTING.md)
