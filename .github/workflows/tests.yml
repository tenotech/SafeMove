name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (fake iPhone, no device needed)
        run: python -m pytest tests -q
      - name: Check that every module compiles
        run: python -m compileall -q safemove build_portable.py make_icon.py
